<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无人机空域协调台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>无人机空域协调台</h1>
<p class="subtitle">航线按连续航段展示爬升/下降高度，冲突逐段定位到航段编号与限制名称。</p>

<section class="panel identity">
  <label>用户 <input id="u" value="reviewer"></label>
  <label>角色
    <select id="r">
      <option value="airspace_reviewer" selected>airspace_reviewer</option>
      <option value="commander">commander</option>
      <option value="operator">operator</option>
      <option value="auditor">auditor</option>
      <option value="viewer">viewer</option>
    </select>
  </label>
  <label>运营方 <input id="op" value="OP1"></label>
  <button onclick="load()">刷新</button>
  <button class="secondary" onclick="toggleRaw()">原始 JSON</button>
</section>

<section class="panel"><div id="plans"></div><pre id="raw" class="hidden"></pre></section>

<script>
const $ = id => document.getElementById(id);
function headers() {
  const h = {"X-User-Id": $("u").value.trim(), "X-Role": $("r").value};
  if ($("op").value.trim()) h["X-Operator"] = $("op").value.trim();
  return h;
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function point(p) { return `${Number(p.lon).toFixed(4)}, ${Number(p.lat).toFixed(4)}, ${Number(p.altitude).toFixed(0)}m`; }

function segmentTable(segments, conflictSet) {
  if (!segments) return "";
  const rows = segments.map(s => {
    const hit = conflictSet.has(s.index);
    return `<tr class="${hit ? "segment-conflict" : ""}">
      <td>${s.index}${hit ? '<span class="seg-flag">▲ 冲突</span>' : ""}</td>
      <td>${point(s.from)}</td><td>${point(s.to)}</td>
      <td>${Number(s.min_altitude).toFixed(0)}–${Number(s.max_altitude).toFixed(0)}m</td>
    </tr>`;
  }).join("");
  return `<table><thead><tr><th>航段</th><th>起点（经,纬,高度）</th><th>终点（经,纬,高度）</th><th>高度区间</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function conflictBox(check) {
  if (!check) return "";
  const items = check.blocking_conflicts || [];
  const located = items.filter(c => c.segment != null);
  if (check.approvable) return '<p class="ok-note">逐段核对通过：无水平范围与高度区间重叠，可批准。</p>';
  if (!located.length) {
    return `<div class="conflicts">存在 ${items.length} 项拦截冲突（非航段类限制，如相邻交通/人口风险）。</div>`;
  }
  return `<div class="conflicts"><strong>${located.length} 个航段与限制区重叠，已阻止批准：</strong><ul>` +
    located.map(c => `<li>航段 ${c.segment} × ${esc(c.name)}（${esc(c.kind)}）— ${esc(c.message)}</li>`).join("") +
    "</ul></div>";
}

async function load() {
  const state = await (await fetch("/api/state", {headers: headers()})).json();
  $("raw").textContent = JSON.stringify(state, null, 2);
  if (state.error) { $("plans").innerHTML = `<div class="conflicts">${esc(state.message)}</div>`; return; }
  const role = $("r").value;
  const detailRoles = new Set(["operator", "airspace_reviewer", "commander", "auditor"]);
  const cards = await Promise.all((state.plans || []).map(async p => {
    let check = null;
    if (detailRoles.has(role)) {
      const res = await fetch(`/api/plans/${p.id}/check`, {headers: headers()});
      check = res.ok ? await res.json() : null;
    }
    const conflictSet = new Set(((check && check.blocking_conflicts) || []).filter(c => c.segment != null).map(c => c.segment));
    return `<article class="plan">
      <h3>#${p.id} ${esc(p.callsign)} <span class="badge ${esc(p.status)}">${esc(p.status)}</span>
        ${p.revision ? `<span class="badge">rev ${p.revision}</span>` : ""}</h3>
      <div class="meta">
        <span>机型 ${esc(p.drone_model || "-")}</span><span>区域 ${esc(p.region || "-")}</span>
        <span>${esc(p.starts_at || "")} → ${esc(p.ends_at || "")}</span><span>申报最大高度 ${p.max_altitude ?? "-"}m</span>
      </div>
      ${segmentTable(p.segments, conflictSet)}
      ${conflictBox(check)}
    </article>`;
  }));
  $("plans").innerHTML = cards.join("") || '<p class="subtitle">暂无计划。</p>';
}
function toggleRaw() { $("raw").classList.toggle("hidden"); }
load();
</script>
</body>
</html>
